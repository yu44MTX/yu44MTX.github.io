<text x="591.5999999999999" y="452" class="dim" text-anchor="start">3.13</text><text x="650" y="180" class="title" text-anchor="start">电脑位与床尾错开</text><text x="650" y="220" class="label" text-anchor="start">床头靠南侧实墙，床尾前留约1.07m。</text><text x="650" y="250" class="label" text-anchor="start">电脑在桌北端，南段留给乐高拼装。</text><text x="650" y="280" class="label" text-anchor="start">主机悬托南段桌下，不占坐席腿部。</text><text x="650" y="330" class="title" text-anchor="start">需要明确的取舍</text><text x="650" y="370" class="label" text-anchor="start">· 64cm侧通道是目标值，须扣现场误差。</text><text x="650" y="402" class="label" text-anchor="start">· 椅子、开衣柜、通阳台按分时使用。</text><text x="650" y="434" class="label" text-anchor="start">· 东北角20cm缝隙不能当作取衣通道。</text><text x="650" y="466" class="label" text-anchor="start">· 推拉门哪一扇开启，会影响实际通路。</text><text x="650" y="498" class="label" text-anchor="start">· 虚线椅是收纳位，实线椅是使用位。</text><text x="650" y="548" class="sub" text-anchor="start">床箱上翻示意 / 非五金详图</text>
