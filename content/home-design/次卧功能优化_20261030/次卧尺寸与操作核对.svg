<text x="650" y="837" class="label" text-anchor="start">上翻为主，不在窄侧通道拉大抽屉。</text>
<text x="650" y="868" class="small" text-anchor="start">床底通风、支撑和助力五金须厂家配套。</text>
<rect x="55" y="915" width="1090" height="91" rx="5" fill="#eef0e6"/>
<text x="75" y="945" class="label" text-anchor="start">下单前：复尺门扇、推拉门净口与开扇、帘布、插座、床架外尺寸及真实椅子。</text>
<text x="75" y="975" class="small" text-anchor="start">吊柜底1.55m、深0.35m。最大乐高、柜内净空、开门轨迹与挂墙承重尚待确认。</text>
